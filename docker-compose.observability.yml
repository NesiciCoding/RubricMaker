# RubricMaker — standalone observability stack (Loki + Prometheus + Alloy + Grafana)
#
# Runs independently of how RubricMaker itself is deployed — the combined
# docker-compose.yml stack, or a traditional Apache/Nginx + HestiaCP/Virtualmin
# server. Only Docker is required on the host running this stack.
#
# ── Usage ──────────────────────────────────────────────────────────────────
#   cp .env.observability.example .env.observability
#   # set GRAFANA_ADMIN_PASSWORD (required — no default), edit RUBRICMAKER_LOG_DIR
#   # (and SUPABASE_DB_* for client_logs and Postgres metrics)
#   docker-compose -f docker-compose.observability.yml --env-file .env.observability up -d
#   Open http://localhost:3001 (login as admin with your GRAFANA_ADMIN_PASSWORD)
#
# See README.md → Deployment → Observability for the three log-source variants
# (traditional web server logs, combined-stack containers, client_logs table).

name: rubricmaker-observability

services:
  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    volumes:
      - ./docker/observability/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  # Grafana Alloy replaced Promtail, which reached end-of-life on 2026-03-02.
  alloy:
    image: grafana/alloy:v1.20.1
    restart: unless-stopped
    volumes:
      - ./docker/observability/config.alloy:/etc/alloy/config.alloy:ro
      # Read positions, so a restart resumes instead of re-sending every log file.
      - alloy-data:/var/lib/alloy/data
      # Host log directory for traditional Apache/Nginx + HestiaCP/Virtualmin
      # deployments (set RUBRICMAKER_LOG_DIR to the panel's log path).
      - ${RUBRICMAKER_LOG_DIR:-/var/log}:/var/host-logs:ro
      # HestiaCP's per-domain web/<domain>/logs/*.log files are symlinks to
      # the panel's real webserver log dir (e.g. /var/log/apache2/domains) —
      # mount that dir too, at the *same* path, so the symlinks resolve
      # inside the container instead of "no such file or directory". Falls
      # back to /var/log (already guaranteed to exist, unlike an Apache-only
      # path) so leaving RUBRICMAKER_WEBSERVER_LOG_DIR unset on non-HestiaCP
      # setups is a harmless no-op rather than creating a bogus empty dir.
      - ${RUBRICMAKER_WEBSERVER_LOG_DIR:-/var/log}:${RUBRICMAKER_WEBSERVER_LOG_DIR:-/var/log}:ro
      # Container logs (the combined docker-compose.yml stack, if it runs here) and container
      # metrics (cAdvisor) for every container on the host.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker:/var/lib/docker:ro
      # Host metrics (node_exporter): the host's /proc, /sys and filesystems, read-only. No `rslave`:
      # it fails to start the container on hosts whose / is not a shared mount, and that would stop
      # log shipping too. A filesystem mounted later shows up after `restart alloy`.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - /run/udev:/run/udev:ro
      # Container metrics (cAdvisor): the host's cgroup tree. Inside a container /sys/fs/cgroup
      # only shows that container's own cgroup, so cAdvisor would see no other container.
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      # cAdvisor reaches Docker's containers through containerd's socket in here (standard
      # docker-ce layout). Like docker.sock it is root-equivalent. The directory is mounted, not
      # the socket file: a missing file would make Docker create a directory in its place.
      - /run/containerd:/run/containerd:ro
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      # Names this server in host and container metrics (and in alert notifications).
      OBSERVABILITY_HOST_NAME: "${OBSERVABILITY_HOST_NAME:-rubricmaker}"
    depends_on: [loki, prometheus]

  # Metrics store. Alloy pushes host, container, Postgres and stack metrics here (remote write).
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Whichever limit is reached first wins (~40 MB/day at the 30s scrape interval).
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}
      - --web.enable-remote-write-receiver

  # Postgres metrics (connections, cache hit ratio, locks, database size). Uses the same
  # SUPABASE_DB_* connection as Grafana's client_logs datasource; pg_up stays 0 until it is set.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: "${SUPABASE_DB_HOST:-localhost:5432}/${SUPABASE_DB_NAME:-postgres}?sslmode=${SUPABASE_DB_SSLMODE:-require}"
      DATA_SOURCE_USER: "${SUPABASE_DB_USER:-}"
      DATA_SOURCE_PASS: "${SUPABASE_DB_PASSWORD:-}"

  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    ports:
      # Bound to localhost only — put a reverse proxy (with HTTPS) in front
      # for remote access. See docs/OBSERVABILITY_HESTIACP.md.
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./docker/observability/grafana-dashboards-provider.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./docker/observability/dashboards:/etc/grafana/provisioning/dashboards/json:ro
    environment:
      # No default — fails fast if GRAFANA_ADMIN_PASSWORD is unset so the
      # stack can never come up with a well-known admin password.
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env.observability}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Grafana 12+ downloads and auto-updates extra plugins from grafana.com on every start. Run
      # only what the pinned image ships (it includes the Loki, Prometheus and Postgres datasources),
      # so the stack is reproducible and starts the same on a firewalled server.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      # Set when Grafana sits behind a reverse-proxy subdomain, so links,
      # redirects and auth cookies use the right external URL.
      GF_SERVER_DOMAIN: "${GRAFANA_DOMAIN:-localhost}"
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-}"
      # Used by grafana-datasources.yml, which always provisions the client_logs
      # Postgres datasource. Leave these unset and Grafana still lists it, but
      # its health check fails until they are set, so its panels cannot query
      # client_logs (Loki is provisioned either way).
      SUPABASE_DB_HOST: "${SUPABASE_DB_HOST:-}"
      SUPABASE_DB_NAME: "${SUPABASE_DB_NAME:-postgres}"
      SUPABASE_DB_USER: "${SUPABASE_DB_USER:-}"
      SUPABASE_DB_PASSWORD: "${SUPABASE_DB_PASSWORD:-}"
      # "require" for managed Supabase Cloud; self-hosted db containers on the
      # same Docker network usually don't have SSL configured for local
      # connections, so set SUPABASE_DB_SSLMODE=disable in that case.
      SUPABASE_DB_SSLMODE: "${SUPABASE_DB_SSLMODE:-require}"
    depends_on: [loki, prometheus]

volumes:
  loki-data:    # persists log chunks across restarts
  alloy-data:   # persists Alloy's read positions (and its write-ahead log)
  prometheus-data: # persists metrics (bounded by PROMETHEUS_RETENTION_TIME / _SIZE)
  grafana-data: # persists Grafana dashboards/users

# ── Optional: self-hosted db on the same host ────────────────────────────────
# If a self-hosted Supabase stack also runs on this host and you want Grafana
# to reach its db container by name, join its Docker network. The network and
# container names depend on which self-hosted stack this is:
#   - This repo's combined docker-compose.yml (`name: rubricmaker`):
#       network rubricmaker_default, SUPABASE_DB_HOST=db:5432
#   - The official Supabase CLI / self-hosted compose stack:
#       network supabase_default, SUPABASE_DB_HOST=supabase-db:5432
#       (connect to the `supabase-db` container directly, not the
#       `supabase-pooler`/Supavisor container also on 5432/6543)
# Confirm with `docker network ls` / `docker ps` on the host — names can be
# customized in either stack's own compose file.
#
# networks:
#   default:
#     name: supabase_default
#     external: true
#
# Otherwise (managed Supabase, or Supabase on another host), leave this
# commented out and set SUPABASE_DB_HOST to the Postgres connection host —
# e.g. db.<project-ref>.supabase.co.
