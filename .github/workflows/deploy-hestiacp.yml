# Manual deploy to the HestiaCP VPS.
#
# Automatic deploys on push to main now run inside ci.yml (the `deploy-hestiacp`
# job), which only fires after every CI + e2e job passes and only when the push
# touched app files. Use this workflow_dispatch to deploy without waiting on CI.
name: Deploy to HestiaCP VPS

on:
  workflow_dispatch:

concurrency:
  group: "hestiacp-deploy"
  cancel-in-progress: false

jobs:
  deploy-hestiacp-manual:
    name: Deploy to HestiaCP VPS (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_PUBLIC_URL: ${{ secrets.SUPABASE_PUBLIC_URL }}
          # Optional diagnostic event stream to `client_logs` — see README →
          # "Stress-test logging". Toggle via repo Settings → Secrets and
          # variables → Actions → Variables (not a secret: it's a feature
          # flag, not sensitive data).
          VITE_STRESS_TEST_LOGGING: ${{ vars.VITE_STRESS_TEST_LOGGING }}

      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@2cbb5ed94b73d111d07a40b071b1c7d3c0272435 # v9.0.2
        with:
          # rsync -a preserves the source's numeric owner/group. The GitHub runner's
          # files are uid/gid 1001, which maps to `hestiamail` on the HestiaCP box, so
          # without --chown the deployed files end up owned by the wrong user (not the
          # `rubricmaker` web-domain user). That mismatch can trip HestiaCP's
          # domain-repair/rebuild, which re-drops the default skeleton index.html into
          # the docroot. --chown forces the correct owner on the receiving side (rsync
          # runs as root here, so it's allowed).
          # --delay-updates + --delete-after: new files land in place together at the end and
          # old ones go only after that, so a visitor (or the service worker installing) mid-deploy
          # never gets an index.html pointing at assets that aren't there yet. The protect filter
          # keeps --delete from removing the server's .htaccess (uploaded by the next step) while
          # still deploying one that is shipped inside dist/.
          switches: -avz --delete-after --delay-updates --filter='P /.htaccess' --chown=rubricmaker:rubricmaker
          path: dist/
          # HestiaCP web root: /home/<user>/web/<domain>/public_html/
          remote_path: /home/rubricmaker/web/${{ secrets.VPS_DOMAIN }}/public_html/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: root
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Upload .htaccess
        uses: burnett01/rsync-deployments@2cbb5ed94b73d111d07a40b071b1c7d3c0272435 # v9.0.2
        with:
          # Same ownership fix as the dist/ rsync above.
          switches: -avz --chown=rubricmaker:rubricmaker
          path: deploy/.htaccess
          remote_path: /home/rubricmaker/web/${{ secrets.VPS_DOMAIN }}/public_html/.htaccess
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: root
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Verify the live site serves RubricMaker
        env:
          VPS_DOMAIN: ${{ secrets.VPS_DOMAIN }}
        # Fails the deploy loudly if the docroot ends up serving something else — e.g. the HestiaCP
        # "web server is ready" skeleton a domain rebuild can drop in — instead of finding out from users.
        run: |
          # The hashed entry script pins this build, so a stale docroot fails too, not only a foreign page.
          entry=$(grep -o 'assets/index-[^"]*\.js' dist/index.html | head -n 1)
          test -n "$entry" || { echo "::error::No entry script found in dist/index.html"; exit 1; }
          for attempt in 1 2 3 4 5; do
            page=$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://${VPS_DOMAIN}/?deploy-check=${GITHUB_SHA}" || true)
            if grep -q 'name="apple-mobile-web-app-title" content="RubricMaker"' <<<"$page" && grep -qF "$entry" <<<"$page"; then
              echo "https://${VPS_DOMAIN}/ serves this build ($entry)"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::https://${VPS_DOMAIN}/ is not serving this build's index.html after deploy (HestiaCP default page or stale docroot?)"
          exit 1

      # Mirrors the drift check in ci.yml's deploy-hestiacp job — see that job's comment and
      # docs/SELF_HOSTING_OPS.md "Migrations and edge functions on the official stack" (#935).
      - name: Check Supabase migration & edge-function drift
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          key_file=$(mktemp)
          remote_dir="/root/.rm-ci-stack-drift-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            ssh -i "$key_file" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o BatchMode=yes \
                "root@${VPS_HOST}" "rm -rf '$remote_dir'" >/dev/null 2>&1 || true
            rm -f "$key_file"
          }
          trap cleanup EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh_opts=(-i "$key_file" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o BatchMode=yes)

          ssh "${ssh_opts[@]}" "root@${VPS_HOST}" "mkdir -p '$remote_dir/scripts' '$remote_dir/supabase/migrations'"
          scp "${ssh_opts[@]}" scripts/stack-drift.py "root@${VPS_HOST}:$remote_dir/scripts/stack-drift.py"
          scp "${ssh_opts[@]}" supabase/migrations/*.sql "root@${VPS_HOST}:$remote_dir/supabase/migrations/"

          set +e
          ssh "${ssh_opts[@]}" "root@${VPS_HOST}" "python3 '$remote_dir/scripts/stack-drift.py' check --repo-dir '$remote_dir'"
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo "::error::Production's database and/or deployed edge functions have drifted from supabase/ in this repo (stack-drift.py exit $status — see output above). Apply pending migrations with 'stack-drift.py apply' and/or redeploy functions with 'scripts/deploy-edge-functions.sh' on the VPS, then re-run this job."
            exit 1
          fi
          echo "Production's database and edge functions match this repository."
