name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  # Runs when a PR enters the merge queue — the queue tests on a temporary
  # branch (gha-merge-queue/...), so without this event the required checks
  # would never run there and the queue would hang.
  merge_group:
  # Weekly full verification of main (incl. the Supabase e2e suite) even in
  # weeks with no pushes/PRs, catching drift the PR-triggered runs miss.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

# Cancel superseded runs for the same ref — a new push/PR makes the old run's
# result moot. Keep in-progress main pushes running (they may feed deploys).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  ci:
    name: Type-check, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # required by vitest-coverage-report-action to post PR comments
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test with coverage
        run: npm run coverage

      # JUnit report (unit-results/results.xml, emitted by the vitest config) —
      # consumed by the Quarantine Check workflow's detect-flaky job to spot
      # unit tests that fail repeatedly across runs.
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-results
          path: unit-results/
          retention-days: 14

      - name: Coverage comment
        if: always()
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # Publishes the shields.io coverage badge (docs/badges/coverage.json) that the
  # README displays. Coverage itself is computed in the `ci` job; this job only
  # turns the resulting coverage-summary.json into an endpoint badge and commits
  # it. Runs on main pushes and weekly schedule runs so the badge always mirrors
  # the default branch — never on PRs, where a push would pollute the PR branch.
  #
  # The badge is pushed to a dedicated `coverage-badge` branch, NOT main: main
  # is protected by the PR-Merge ruleset (PRs + required checks), so a direct
  # main push by the GITHUB_TOKEN is rejected. The branch is written only by
  # this job, so it can never diverge from reality, and shields.io reads any
  # branch. Kept as its own job so the `ci` job keeps its contents: read
  # permission; this one needs contents: write for the commit+push. GITHUB_TOKEN
  # pushes do not re-trigger workflows, so there is no update loop.
  coverage-badge:
    name: Publish coverage badge
    runs-on: ubuntu-latest
    needs: ci
    if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        # persist-credentials stays enabled (the default) so `git push` below
        # can authenticate with the GITHUB_TOKEN.

      - name: Download coverage report
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: coverage-report
          path: coverage

      - name: Generate and publish coverage badge
        run: |
          node scripts/generate-coverage-badge.mjs
          # Porcelain reports both modified and newly-created (??) files, so the
          # very first publish (when docs/badges/coverage.json does not exist in
          # the repo yet) is not skipped.
          if [ -z "$(git status --porcelain -- docs/badges/)" ]; then
            echo "Coverage badge unchanged — nothing to publish"
            exit 0
          fi
          # Only publish when this run's tested revision (GITHUB_SHA) is still
          # main's HEAD. If main moved on while CI ran (e.g. two pushes in a
          # row), skip: the newer run will publish fresher coverage. Without
          # this guard, a slow run could publish stale coverage data computed
          # from an older main revision and clobber the up-to-date badge.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main moved since this run started — skipping publication (a newer run will publish)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/badges/coverage.json
          git commit -m "chore: update coverage badge"
          # Publish to the dedicated coverage-badge branch (main is protected).
          # The branch is written ONLY by this job and always represents "current
          # main + badge", so force-push is safe: no history to preserve, no
          # merge conflicts, and concurrent publishes converge (the GITHUB_SHA
          # guard above already ensures only runs of the current main publish).
          # Fetch first so --force-with-lease has a lease ref to compare against.
          git fetch -q origin coverage-badge:refs/remotes/origin/coverage-badge 2>/dev/null || true
          if git rev-parse -q --verify refs/remotes/origin/coverage-badge >/dev/null 2>&1; then
            # Branch exists — force-with-lease rejects if it moved since our
            # fetch (a concurrent publish), keeping us from clobbering it.
            git push --force-with-lease origin HEAD:coverage-badge
          else
            # Very first publish — the branch doesn't exist yet, so a plain
            # push creates it.
            git push origin HEAD:coverage-badge
          fi
          echo "Coverage badge published: $(node -p "require('./docs/badges/coverage.json').message") lines"

  # E2E runs in parallel with `ci` (independent of typecheck/lint) and is split
  # across two shards. Each shard emits a blob report; `e2e-merge-reports`
  # merges them into the final HTML + JUnit reports after the shards finish.
  e2e:
    name: E2E (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run E2E tests (shard ${{ matrix.shard }}/2)
        run: |
          npx playwright test \
            --project=chromium --project=firefox --project=webkit \
            --project=chromium-fake-media --project=mobile-chrome \
            --shard=${{ matrix.shard }}/2 --reporter=blob,list
        env:
          CI: true

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-blob-${{ matrix.shard }}
          path: blob-report/
          retention-days: 3

  e2e-merge-reports:
    name: E2E Report
    runs-on: ubuntu-latest
    needs: e2e
    if: ${{ !cancelled() }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: all-blob-reports
          pattern: playwright-blob-*
          merge-multiple: true

      # Loads the reporter list (html + junit) and their output paths from
      # playwright.config.ts, so the merged HTML lands in playwright-report/ and
      # JUnit in playwright-results/results.xml.
      - name: Merge reports
        run: npx playwright merge-reports -c playwright.config.ts ./all-blob-reports

      - name: Upload merged HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: playwright-results/
          retention-days: 14

  e2e-supabase:
    name: E2E — Supabase Integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.104.0

      # Cold-starting the local stack pulls several images from ghcr.io on a
      # fresh hosted runner, which has intermittently exceeded 5 minutes and
      # killed the job (see PRs #449, #456, #459). Give it ample headroom.
      - name: Start local Supabase stack
        run: supabase start
        timeout-minutes: 10

      - name: Export Supabase credentials
        run: |
          STATUS=$(supabase status)
          # Supabase CLI v2 uses sb_publishable_* / sb_secret_* keys in a table.
          # Older CLI versions used "anon key:" / "service_role key:" with JWTs.
          ANON_KEY=$(echo "$STATUS" | grep -oE 'sb_publishable_[A-Za-z0-9_-]+')
          SVC_KEY=$(echo "$STATUS" | grep -oE 'sb_secret_[A-Za-z0-9_-]+')
          # Legacy JWT fallback
          if [ -z "$ANON_KEY" ]; then
            ANON_KEY=$(echo "$STATUS" | awk '/anon key:/{print $NF}')
          fi
          if [ -z "$SVC_KEY" ]; then
            SVC_KEY=$(echo "$STATUS" | awk '/service_role key:/{print $NF}')
          fi
          if [ -z "$ANON_KEY" ] || [ -z "$SVC_KEY" ]; then
            echo "::error::Failed to extract Supabase credentials from supabase status"
            echo "$STATUS"
            exit 1
          fi
          echo "SUPABASE_TEST_URL=http://127.0.0.1:54321" >> $GITHUB_ENV
          echo "SUPABASE_TEST_ANON_KEY=$ANON_KEY" >> $GITHUB_ENV
          echo "SUPABASE_TEST_SERVICE_KEY=$SVC_KEY" >> $GITHUB_ENV

      - name: Run Supabase E2E tests
        run: npm run e2e:supabase
        env:
          CI: true

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-supabase
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results-supabase
          path: playwright-results/
          retention-days: 14

  bundle:
    name: Bundle Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with bundle stats
        run: npm run build
        env:
          VITE_ANALYZE: 'true'

      - name: Check bundle size
        run: |
          TOTAL=$(find dist/assets -name '*.js' -type f -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          echo "Total JS bundle size: ${TOTAL} bytes ($(( TOTAL / 1024 )) KB)"
          if [ "$TOTAL" -gt 6000000 ]; then
            echo "::warning::Bundle exceeds 6 MB — review heavy imports"
          fi

      - name: Upload bundle stats
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-stats
          path: dist/stats.html
          retention-days: 14

  # Production deploys live here so they only fire after every CI job above has
  # passed — the `needs` + result checks below are the gate. Each deploy also
  # skips itself when the push touched no app files (doc/CI-only pushes), via a
  # compare of the pushed range. The standalone deploy-*.yml workflows are now
  # manual-only (workflow_dispatch); use them to deploy without waiting on CI.
  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [ci, e2e, e2e-merge-reports, e2e-supabase, bundle]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci.result == 'success' && needs.e2e.result == 'success' && needs['e2e-merge-reports'].result == 'success' && needs['e2e-supabase'].result == 'success' && needs.bundle.result == 'success' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false # deploys push via their own mechanisms, not git

      - name: Check whether app files changed
        id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API="repos/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }}"
          # The Compare API caps the file list at 300 entries. Past that we
          # can't prove nothing app-relevant changed, so deploy conservatively.
          COUNT=$(gh api "$API" --jq '.files | length')
          if [ "$COUNT" -ge 300 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED_FILES=$(gh api "$API" --jq '.files[].filename')
          MATCH=$(echo "$CHANGED_FILES" | grep -cE '^(src/|public/|index\.html$|package\.json$|package-lock\.json$|vite\.config\.ts$|tsconfig\.json$|eslint\.config\.js$|deploy/)' || true)
          if [ "$MATCH" -gt 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: npm ci

      - name: Build
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: Setup Pages
        if: steps.changes.outputs.changed == 'true'
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4

      - name: Upload artifact
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        if: steps.changes.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  deploy-hestiacp:
    name: Deploy to HestiaCP VPS
    runs-on: ubuntu-latest
    needs: [ci, e2e, e2e-merge-reports, e2e-supabase, bundle]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci.result == 'success' && needs.e2e.result == 'success' && needs['e2e-merge-reports'].result == 'success' && needs['e2e-supabase'].result == 'success' && needs.bundle.result == 'success' }}
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false # deploys push via their own mechanisms, not git

      - name: Check whether app files changed
        id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API="repos/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }}"
          # The Compare API caps the file list at 300 entries. Past that we
          # can't prove nothing app-relevant changed, so deploy conservatively.
          COUNT=$(gh api "$API" --jq '.files | length')
          if [ "$COUNT" -ge 300 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED_FILES=$(gh api "$API" --jq '.files[].filename')
          MATCH=$(echo "$CHANGED_FILES" | grep -cE '^(src/|public/|index\.html$|package\.json$|package-lock\.json$|vite\.config\.ts$|tsconfig\.json$|eslint\.config\.js$|deploy/)' || true)
          if [ "$MATCH" -gt 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: npm ci

      - name: Build
        if: steps.changes.outputs.changed == 'true'
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_PUBLIC_URL: ${{ secrets.SUPABASE_PUBLIC_URL }}
          # Optional diagnostic event stream to `client_logs` — see README →
          # "Stress-test logging". Toggle via repo Settings → Secrets and
          # variables → Actions → Variables (not a secret: it's a feature
          # flag, not sensitive data).
          VITE_STRESS_TEST_LOGGING: ${{ vars.VITE_STRESS_TEST_LOGGING }}

      - name: Deploy via rsync
        if: steps.changes.outputs.changed == 'true'
        uses: burnett01/rsync-deployments@4d419d1dc46d4a8a2b6ceab2f951f0f93b2da8f5 # v9.0.0
        with:
          switches: -avz --delete
          path: dist/
          # HestiaCP web root: /home/<user>/web/<domain>/public_html/
          remote_path: /home/rubricmaker/web/${{ secrets.VPS_DOMAIN }}/public_html/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: root
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Upload .htaccess
        if: steps.changes.outputs.changed == 'true'
        uses: burnett01/rsync-deployments@4d419d1dc46d4a8a2b6ceab2f951f0f93b2da8f5 # v9.0.0
        with:
          switches: -avz
          path: deploy/.htaccess
          remote_path: /home/rubricmaker/web/${{ secrets.VPS_DOMAIN }}/public_html/.htaccess
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: root
          remote_key: ${{ secrets.VPS_SSH_KEY }}

  deploy-vps:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [ci, e2e, e2e-merge-reports, e2e-supabase, bundle]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci.result == 'success' && needs.e2e.result == 'success' && needs['e2e-merge-reports'].result == 'success' && needs['e2e-supabase'].result == 'success' && needs.bundle.result == 'success' }}
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false # deploys push via their own mechanisms, not git

      - name: Check whether app files changed
        id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API="repos/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }}"
          # The Compare API caps the file list at 300 entries. Past that we
          # can't prove nothing app-relevant changed, so deploy conservatively.
          COUNT=$(gh api "$API" --jq '.files | length')
          if [ "$COUNT" -ge 300 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED_FILES=$(gh api "$API" --jq '.files[].filename')
          MATCH=$(echo "$CHANGED_FILES" | grep -cE '^(src/|public/|index\.html$|package\.json$|package-lock\.json$|vite\.config\.ts$|tsconfig\.json$|eslint\.config\.js$|deploy/)' || true)
          if [ "$MATCH" -gt 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: npm ci

      - name: Build
        if: steps.changes.outputs.changed == 'true'
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy via rsync
        if: steps.changes.outputs.changed == 'true'
        uses: burnett01/rsync-deployments@4d419d1dc46d4a8a2b6ceab2f951f0f93b2da8f5 # v9.0.0
        with:
          switches: -avz --delete
          path: dist/
          # Virtualmin web root: /home/<user>/public_html/
          remote_path: /home/${{ secrets.VPS_USER }}/public_html/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Upload .htaccess
        if: steps.changes.outputs.changed == 'true'
        uses: burnett01/rsync-deployments@4d419d1dc46d4a8a2b6ceab2f951f0f93b2da8f5 # v9.0.0
        with:
          switches: -avz
          path: deploy/.htaccess
          remote_path: /home/${{ secrets.VPS_USER }}/public_html/.htaccess
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}
