# RubricMaker — Nginx conf extension for HestiaCP (Nginx + Apache stack)
#
# HOW TO USE:
#   HestiaCP generates its Nginx configs automatically. Customise them by
#   dropping snippet files into the domain's conf directory — HestiaCP
#   includes them automatically on rebuild.
#
#   1. Replace every instance of:
#        rubricmaker.example.com  →  your actual domain
#        /home/rubricmaker        →  /home/YOUR_HESTIACP_USER
#        supabase.rubricmaker.nl  →  your own self-hosted Supabase domain, if
#                                     forking this for a different deployment
#                                     (in the CSP connect-src below; drop it
#                                     if you're on Supabase Cloud instead)
#
#   2. Copy this file to the server for the HTTPS (SSL) vhost:
#        /home/rubricmaker/conf/web/rubricmaker.example.com/nginx.ssl.conf_after
#
#      For the plain-HTTP vhost as well (redirected to HTTPS, so optional):
#        /home/rubricmaker/conf/web/rubricmaker.example.com/nginx.conf_after
#
#   3. Rebuild / reload the Nginx config:
#        sudo hestia-nginx rebuild
#        # or:
#        sudo systemctl reload nginx
#
# NOTE: HestiaCP's default proxy template already defines location / (it
# proxies to Apache) and serves static files itself. This file adds security
# headers and routes the app shell around HestiaCP's long static-file caching
# — it does NOT redefine location /. The .htaccess file handles SPA routing and
# Cache-Control on the Apache side. It relies on the `@fallback` location every
# stock HestiaCP proxy template defines; `nginx -t` fails if yours has none.
#
# LOGGING: HestiaCP writes access/error logs per-domain to
#   /var/log/$WEB_SYSTEM/domains/rubricmaker.example.com.log
#   /var/log/$WEB_SYSTEM/domains/rubricmaker.example.com.error.log
# (e.g. /var/log/apache2/domains/ and /var/log/nginx/domains/). To feed these
# into the optional observability stack (docker-compose.observability.yml),
# set RUBRICMAKER_LOG_DIR=/var/log.
# ─────────────────────────────────────────────────────────────────────────────

# ── Security headers ──────────────────────────────────────────────────────────
add_header X-Content-Type-Options   "nosniff"                          always;
add_header X-Frame-Options          "SAMEORIGIN"                       always;
add_header X-XSS-Protection         "1; mode=block"                    always;
add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
add_header Permissions-Policy       "geolocation=(), camera=(self), microphone=(self), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# CSP: script-src has no 'unsafe-inline' — Vite production builds emit no inline
# scripts. connect-src explicitly lists this deployment's self-hosted Supabase
# domain — the *.supabase.co wildcard does not match a custom domain, so
# without this the Realtime websocket gets silently CSP-blocked (GH #280).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' https: data: blob:; connect-src 'self' https://supabase.rubricmaker.nl wss://supabase.rubricmaker.nl https://*.supabase.co wss://*.supabase.co https://api.languagetool.org https://api.commonstandardsproject.com https://api.dictionaryapi.dev https://api.mymemory.translated.net; worker-src 'self' blob:; frame-src data: blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;

# ── App shell, service worker and manifest: hand to Apache, uncached ─────────
# HestiaCP nests a static-file location inside its own `location /` that serves
# its "proxy extensions" (js among them) straight from disk with `expires max`,
# and nginx checks that nested regex before any server-level one. So sw.js would
# be cached for years. Exact matches win over every regex, so these four paths
# skip it and go to HestiaCP's own `@fallback`, which proxies to this domain's
# Apache vhost (never hard-code 127.0.0.1 here: HestiaCP binds Apache to the
# server's IP, and 127.0.0.1 reaches Apache's default site, i.e. the HestiaCP
# "web server is ready" page). Apache's .htaccess then sends no-cache for them.
location = /                     { try_files /.rubricmaker-no-such-file @fallback; }
location = /index.html           { try_files /.rubricmaker-no-such-file @fallback; }
location = /sw.js                { try_files /.rubricmaker-no-such-file @fallback; }
location = /manifest.webmanifest { try_files /.rubricmaker-no-such-file @fallback; }

