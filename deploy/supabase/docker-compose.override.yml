# Overrides for the official Supabase self-hosting stack
# (https://github.com/supabase/supabase/tree/master/docker): mail templates, port
# lockdown (#930) and memory guardrails (#932). Copy this file next to that
# stack's docker-compose.yml — Compose loads docker-compose.override.yml
# automatically — and see docs/SELF_HOSTING_OPS.md → Hardening the official
# stack for the host-level steps this file doesn't cover (swap, Studio/MCP
# tunnel, nmap verification, trimming Logflare/Vector and unused HestiaCP
# services).
#
# Mail: copy public/email-templates/*.html into ./volumes/mail-templates/, add
# APP_URL (where the app is served, e.g. https://app.rubricmaker.nl) to the
# stack's .env, then:
#   docker compose up -d --force-recreate mail-templates auth functions
#
# The templates show only the 8-digit code, never a clickable token link: mail
# scanners such as Microsoft Safe Links open links on arrival and would use up the
# one-time token before the teacher can type it.

services:
    # #930: bind the gateway and pooler to loopback only. Upstream publishes these on all
    # interfaces, and Docker inserts its own iptables rules ahead of the host firewall, so a port
    # blocked in HestiaCP/ufw is still reachable without this. HestiaCP's nginx already
    # reverse-proxies the public API domain to the gateway on 127.0.0.1. `!override` forces Compose
    # to replace the upstream `ports` list outright instead of merging into it — without it, a merge
    # that appends rather than replaces would leave the old public binding live alongside this one.
    # The gateway service is `api-gw` (Envoy-based on newer checkouts — the upstream compose
    # replaced Kong) and publishes only 8000 there; the 8443 entry is a no-op if nothing inside the
    # container listens on it, kept for checkouts still on the older Kong image. Verify from
    # outside the VPS: nmap -Pn -p 5432,6543,8000,8443 <vps-ip> should show all four closed/filtered.
    api-gw:
        ports: !override
            - '127.0.0.1:${KONG_HTTP_PORT:-8000}:8000/tcp'
            - '127.0.0.1:${KONG_HTTPS_PORT:-8443}:8443/tcp'
        mem_limit: 512m

    # Supavisor accepts Postgres logins directly; brute-forcing postgres.<tenant> against a port
    # open to the internet is a known attack pattern. Loopback-only forces every caller through an
    # SSH tunnel or WireGuard/Tailscale, same as Studio and /mcp (see the ops doc).
    supavisor:
        ports: !override
            - '127.0.0.1:${POSTGRES_PORT:-5432}:5432/tcp'
            - '127.0.0.1:${POOLER_PROXY_PORT_TRANSACTION:-6543}:6543/tcp'
        mem_limit: 256m

    # #932: a memory limit on every non-critical container means the kernel kills the container
    # that overran — Studio, imgproxy, meta, and later LanguageTool/Whisper — instead of
    # OOM-killing Postgres mid-lesson. `oom_score_adj` on `db` makes that explicit even if a limit
    # is missed somewhere.
    db:
        oom_score_adj: -800

    studio:
        mem_limit: 512m

    imgproxy:
        mem_limit: 256m

    meta:
        mem_limit: 256m

    rest:
        mem_limit: 256m

    storage:
        mem_limit: 256m

    mail-templates:
        image: nginx:1.29-alpine
        restart: unless-stopped
        mem_limit: 64m
        volumes:
            - ./volumes/mail-templates:/usr/share/nginx/html:ro

    auth:
        mem_limit: 256m
        depends_on:
            mail-templates:
                condition: service_started
        environment:
            GOTRUE_MAILER_OTP_LENGTH: '8'
            GOTRUE_MAILER_OTP_EXP: '3600'
            GOTRUE_SMTP_MAX_FREQUENCY: 60s
            GOTRUE_RATE_LIMIT_EMAIL_SENT: '200'
            GOTRUE_MAILER_TEMPLATES_CONFIRMATION: 'http://mail-templates/confirmation.html'
            GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: 'http://mail-templates/magic-link.html'
            GOTRUE_MAILER_TEMPLATES_RECOVERY: 'http://mail-templates/recovery.html'
            GOTRUE_MAILER_TEMPLATES_INVITE: 'http://mail-templates/invite.html'
            GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGE: 'http://mail-templates/email-change.html'
            GOTRUE_MAILER_TEMPLATES_REAUTHENTICATION: 'http://mail-templates/reauthentication.html'
            GOTRUE_MAILER_SUBJECTS_CONFIRMATION: 'Je RubricMaker-inlogcode / Your RubricMaker sign-in code'
            GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: 'Je RubricMaker-inlogcode / Your RubricMaker sign-in code'
            GOTRUE_MAILER_SUBJECTS_RECOVERY: 'Je RubricMaker-herstelcode / Your RubricMaker recovery code'
            GOTRUE_MAILER_SUBJECTS_INVITE: "Uitnodiging voor RubricMaker / You've been invited to RubricMaker"
            GOTRUE_MAILER_SUBJECTS_EMAIL_CHANGE: 'Bevestig je nieuwe e-mailadres / Confirm your new email address'
            GOTRUE_MAILER_SUBJECTS_REAUTHENTICATION: 'Je RubricMaker-bevestigingscode / Your RubricMaker confirmation code'

    # Realtime deletes and recreates its self-hosted tenant (realtime-dev) on every start, so limits
    # edited in _realtime.tenants are lost on restart. A newly created tenant takes its limits from
    # these variables (Realtime's defaults are 200 / 100 / 100 / 100). The Live Monitor joins one
    # channel per student and every student page broadcasts a heartbeat and a snapshot every few
    # seconds, so whole classes need more than the defaults.
    realtime:
        mem_limit: 512m
        environment:
            TENANT_MAX_CONCURRENT_USERS: '1000'
            TENANT_MAX_EVENTS_PER_SECOND: '1000'
            TENANT_MAX_JOINS_PER_SECOND: '500'
            TENANT_MAX_CHANNELS_PER_CLIENT: '200'

    # The grade, message and digest notifications are sent by edge functions over the same SMTP
    # account (supabase/functions/_deno/mail.ts). APP_URL is used for the links in those emails.
    # The *_HEARTBEAT_URLs are dead-man's-switch monitors pinged on success only (see
    # supabase/functions/_shared/heartbeat.ts — an unset/empty URL is skipped, so leaving
    # them empty is fine). They must still be present in the container environment:
    # stack-drift.py treats any Deno.env.get() key missing from `docker inspect` as drift
    # and fails the deploy's drift check.
    functions:
        mem_limit: 512m
        environment:
            SMTP_HOST: ${SMTP_HOST}
            SMTP_PORT: ${SMTP_PORT}
            SMTP_USER: ${SMTP_USER}
            SMTP_PASS: ${SMTP_PASS}
            SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
            SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
            APP_URL: ${APP_URL:-}
            CLEANUP_HEARTBEAT_URL: ${CLEANUP_HEARTBEAT_URL:-}
            DIGEST_HEARTBEAT_URL: ${DIGEST_HEARTBEAT_URL:-}
            NIGHTLY_BACKUP_HEARTBEAT_URL: ${NIGHTLY_BACKUP_HEARTBEAT_URL:-}
