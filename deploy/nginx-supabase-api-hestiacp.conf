# RubricMaker — Nginx conf extension for the public Supabase API domain (HestiaCP)
#
# #930: HestiaCP's default proxy template forwards every path on the API domain
# (e.g. supabase.rubricmaker.nl) to the gateway on 127.0.0.1:8000. That includes
# Studio's dashboard (/project, /api/platform) and the Studio MCP endpoint
# (/mcp), which can run arbitrary SQL — neither should be reachable from the
# public internet, tunnel or not.
#
# HOW TO USE:
#   1. Replace supabase.rubricmaker.nl with your own domain if forking this.
#   2. Copy this file to:
#        /home/rubricmaker/conf/web/supabase.rubricmaker.nl/nginx.ssl.conf_after
#      (and the plain-HTTP vhost's nginx.conf_after, redirected to HTTPS, so optional)
#   3. Reload: sudo hestia-nginx rebuild   (or: sudo systemctl reload nginx)
#   4. Reach Studio and /mcp yourself over an SSH tunnel instead:
#        ssh -L 8000:127.0.0.1:8000 <vps-user>@<vps-ip>
#      then open http://127.0.0.1:8000/project or point .mcp.json's "supabase"
#      entry at http://127.0.0.1:8000/mcp while the tunnel is open. WireGuard or
#      Tailscale work the same way without a one-off SSH session.
#   5. Rotate DASHBOARD_PASSWORD (the stack's .env) once this is live, since the
#      old one may have crossed the network before the lockdown.
#
# VERIFY: from a machine that is NOT on the tunnel/VPN, both of these must fail
# (connection refused/closed, not a 401 — a reachable 401 still leaks that the
# dashboard exists and lets a brute-force run against it):
#   curl -I https://supabase.rubricmaker.nl/project
#   curl -I https://supabase.rubricmaker.nl/mcp
# ─────────────────────────────────────────────────────────────────────────────

location ~ ^/(project|api/platform|mcp) {
    deny all;
    return 404;
}
