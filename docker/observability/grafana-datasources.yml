# Provisions Grafana datasources on startup.
# - Loki and Prometheus are always available (part of this stack).
# - The Postgres datasource is always provisioned so `client_logs` (app-level
#   events from Part 1) can be queried directly — it points at SUPABASE_DB_HOST
#   (with SUPABASE_DB_NAME/USER/PASSWORD/SSLMODE) and works for a self-hosted
#   `db` container or a managed Supabase project. Leave those unset and the
#   datasource is still listed but its health check fails.

apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true

  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      timeInterval: 30s

  - name: Supabase Postgres (client_logs)
    type: postgres
    uid: client_logs_postgres
    access: proxy
    url: "${SUPABASE_DB_HOST}"
    database: "${SUPABASE_DB_NAME}"
    user: "${SUPABASE_DB_USER}"
    secureJsonData:
      password: "${SUPABASE_DB_PASSWORD}"
    jsonData:
      sslmode: "${SUPABASE_DB_SSLMODE}"
      postgresVersion: 1500
      timescaledb: false
